name: Release Windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable release tag to publish
        required: true
        type: string

permissions: {}

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

jobs:
  validate-release-ref:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require a valid v* release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[^/]+$ ]]; then
            echo "Release workflows require a v* release tag; received '$RELEASE_TAG'." >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "push" && ( "$GITHUB_REF_TYPE" != "tag" || "$GITHUB_REF_NAME" != "$RELEASE_TAG" ) ]]; then
            echo "Push release workflows must run from the requested tag; received $GITHUB_REF_TYPE:$GITHUB_REF_NAME for '$RELEASE_TAG'." >&2
            exit 1
          fi

  preflight-release:
    needs: validate-release-ref
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Refuse an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          REPOSITORY: ${{ github.repository }}
        shell: pwsh
        run: |
          $encodedTag = [Uri]::EscapeDataString($env:RELEASE_TAG)
          $releasePath = "repos/$($env:REPOSITORY)/releases/tags/$encodedTag"
          $result = gh api $releasePath 2>&1
          if ($LASTEXITCODE -eq 0) {
            throw "Release $($env:RELEASE_TAG) already exists; existing releases are never overwritten."
          }
          if (($result -join "`n") -notmatch '(?i)not found|HTTP 404') {
            throw "Could not confirm that release $($env:RELEASE_TAG) is absent. Refusing to continue."
          }
          $global:LASTEXITCODE = 0
          Write-Host "OK: no existing release for $($env:RELEASE_TAG)."

  build-test:
    needs:
      - validate-release-ref
      - preflight-release
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      source_archive_artifact_id: ${{ steps.source_artifact.outputs.artifact-id }}
      yt_dlp_source_artifact_id: ${{ steps.yt_dlp_source_artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable toolchain action
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - name: Install visual validation dependencies and Chromium
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --no-input pillow==12.3.0 playwright==1.62.0
          if ($LASTEXITCODE -ne 0) { throw 'Visual validation dependency installation failed.' }
          python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Playwright Chromium installation failed.' }
      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund
      - name: Check local Tauri build command
        run: npm run check:local-build
      - name: Build web frontend
        run: npm run build:web
      - name: Check source manifest and version
        shell: pwsh
        run: |
          python scripts/build-nsis-artwork.py
          npm run check:manifest
          npm run version:check
      - name: Run the complete project release gate
        run: npm run check:release
      - name: Test release artifact contracts
        run: npm run test:release-artifacts
      - name: Test yt-dlp source input fetch contract
        run: npm run test:yt-dlp-source-fetch
      - name: Checkout pinned release tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.workflow_sha }}
          path: output/release-tools
          persist-credentials: false
          sparse-checkout: |
            scripts/assemble-yt-dlp-corresponding-source.py
            src-tauri/resources/licenses/YT-DLP-LICENSE.txt
            src-tauri/resources/licenses/YT-DLP-NOTICE.txt
            src-tauri/resources/licenses/YT-DLP-THIRD-PARTY-LICENSES.txt
          sparse-checkout-cone-mode: false
      - name: Fetch and assemble the pinned yt-dlp corresponding-source archive
        shell: pwsh
        run: |
          npm run source:yt-dlp:fetch -- --staging-directory output/yt-dlp-source-inputs
          if ($LASTEXITCODE -ne 0) { throw 'Fetching pinned yt-dlp source inputs failed.' }
          python output/release-tools/scripts/assemble-yt-dlp-corresponding-source.py --staging-directory output/yt-dlp-source-inputs --output-directory output/release-assets
          if ($LASTEXITCODE -ne 0) { throw 'Assembling the yt-dlp corresponding-source archive failed.' }
          $archive = Get-Item -LiteralPath 'output/release-assets/yt-dlp-2026.08.19-win64-corresponding-source.tar.xz' -ErrorAction Stop
          $sha256 = (Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($archive.Length -ne 89855212 -or $sha256 -ne '78f552ec5c4bd5c05012cc1c9c1c8eb526d301bdd3f2cbbe1bab79d507c27184') {
            throw "yt-dlp corresponding-source archive did not match its technical pin (bytes=$($archive.Length), sha256=$sha256)."
          }
      - name: Upload yt-dlp corresponding-source input for package verification
        id: yt_dlp_source_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yt-dlp-corresponding-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/release-assets/yt-dlp-2026.08.19-win64-corresponding-source.tar.xz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Run Rust format, check, tests, and clippy
        shell: pwsh
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          if ($LASTEXITCODE -ne 0) { throw 'cargo fmt failed.' }
          cargo check --manifest-path src-tauri/Cargo.toml --locked --all-targets --features maintainer-tooling
          if ($LASTEXITCODE -ne 0) { throw 'cargo check failed.' }
          cargo test --manifest-path src-tauri/Cargo.toml --locked --lib --features maintainer-tooling
          if ($LASTEXITCODE -ne 0) { throw 'cargo test failed.' }
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets --features maintainer-tooling -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'cargo clippy failed.' }
      - name: Create and validate the exact source archive
        shell: pwsh
        run: |
          $sourceOutput = npm run source:archive --silent
          if ($LASTEXITCODE -ne 0) { throw 'Source archive creation failed.' }
          $sourceInfo = ($sourceOutput -join "`n") | ConvertFrom-Json
          $sourceArchive = [string]$sourceInfo.archive
          if ([string]::IsNullOrWhiteSpace($sourceArchive) -or -not (Test-Path -LiteralPath $sourceArchive -PathType Leaf)) {
            throw 'Source archive command did not return an existing archive.'
          }
          New-Item -ItemType Directory -Force -Path output/source-release | Out-Null
          $sourceArchivePath = Join-Path $PWD 'output/source-release/clear-download-manager-source.tar'
          Copy-Item -LiteralPath $sourceArchive -Destination $sourceArchivePath -Force
          npm run check:source-release -- --archive $sourceArchivePath
          if ($LASTEXITCODE -ne 0) { throw 'Source archive release gate failed.' }
      - name: Upload source archive input for the package job
        id: source_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cdm-source-archive-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/source-release/clear-download-manager-source.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  package-sign:
    needs: build-test
    runs-on: windows-latest
    environment:
      name: release
    permissions:
      contents: read
    outputs:
      release_artifact_id: ${{ steps.release_artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable toolchain action
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - name: Install visual build dependency
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --no-input pillow==12.3.0 playwright==1.62.0
          if ($LASTEXITCODE -ne 0) { throw 'Installing visual build dependencies failed.' }
          python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Installing Playwright Chromium failed.' }
      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund
      - name: Prepare pinned SAFE LEAN MSYS2 toolchain
        shell: pwsh
        run: ./scripts/prepare-safe-lean-toolchain.ps1
      - name: Download the source archive produced by build-test
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build-test.outputs.source_archive_artifact_id }}
          path: source-input
      - name: Download the yt-dlp corresponding-source archive produced by build-test
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build-test.outputs.yt_dlp_source_artifact_id }}
          path: yt-dlp-source-input
      - name: Validate updater target for latest.json
        shell: pwsh
        run: |
          $cfg = Get-Content src-tauri/resources/updater/updater-config.json -Raw | ConvertFrom-Json
          if (-not $cfg.enabled -or [string]::IsNullOrWhiteSpace($cfg.repository)) {
            throw 'The updater does not have a valid release repository.'
          }
          $releaseRepository = [string]$cfg.repository
          if ($releaseRepository -notmatch '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$' -or
              -not [StringComparer]::OrdinalIgnoreCase.Equals($releaseRepository, $env:GITHUB_REPOSITORY)) {
            throw 'The updater release repository must match GITHUB_REPOSITORY.'
          }
      - name: Build and sign the Windows package once
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.RELEASE_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY) -or
              [string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw 'The release environment is missing one or both Tauri signing secrets.'
          }
          npm run build:windows:final
          if ($LASTEXITCODE -ne 0) { throw 'The signed Windows package build failed.' }
      - name: Prepare signed Core/update files and CDM source archive
        shell: pwsh
        run: |
          ./scripts/prepare-update-release.ps1 -Clean -Tag $env:RELEASE_TAG -ReleaseNotes "Release $env:RELEASE_TAG"
          $sourceArchives = @(Get-ChildItem source-input -File -Filter 'clear-download-manager-source.tar')
          if ($sourceArchives.Count -ne 1) { throw 'Expected exactly one source archive artifact from build-test.' }
          Copy-Item -LiteralPath $sourceArchives[0].FullName -Destination output/update-release/clear-download-manager-source.tar -Force
          $ytDlpSources = @(Get-ChildItem yt-dlp-source-input -File -Filter 'yt-dlp-2026.08.19-win64-corresponding-source.tar.xz')
          if ($ytDlpSources.Count -ne 1) { throw 'Expected exactly one yt-dlp corresponding-source artifact from build-test.' }
          $ytDlpSourceSha256 = (Get-FileHash -LiteralPath $ytDlpSources[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($ytDlpSources[0].Length -ne 89855212 -or $ytDlpSourceSha256 -ne '78f552ec5c4bd5c05012cc1c9c1c8eb526d301bdd3f2cbbe1bab79d507c27184') {
            throw "The yt-dlp corresponding-source artifact failed its exact size/hash check (bytes=$($ytDlpSources[0].Length), sha256=$ytDlpSourceSha256)."
          }
      - name: Assemble exact optional component packages and release evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ytDlpSources = @(Get-ChildItem yt-dlp-source-input -File -Filter 'yt-dlp-2026.08.19-win64-corresponding-source.tar.xz')
          if ($ytDlpSources.Count -ne 1) { throw 'Expected exactly one verified yt-dlp source archive.' }
          $runtimeDirectory = 'src-tauri/resources/bin'
          $requiredRuntimeFiles = @('runtime-manifest.json', 'yt-dlp.exe', 'ffmpeg.exe', 'ffprobe.exe', 'deno.exe', 'aria2c.exe')
          foreach ($runtimeFile in $requiredRuntimeFiles) {
            if (-not (Test-Path -LiteralPath (Join-Path $runtimeDirectory $runtimeFile) -PathType Leaf)) {
              throw "Required runtime inventory file is missing before component packaging: $runtimeFile"
            }
          }
          ./scripts/assemble-component-release-assets.ps1 -ReleaseTag $env:RELEASE_TAG -Sequence ([UInt64]$env:GITHUB_RUN_NUMBER) -KeyId 'component-catalog-2026-01' -OutputDirectory 'output/component-release-assets' -YtDlpSourceArchive $ytDlpSources[0].FullName
          ./scripts/validation/inspect-component-packages.ps1 -PackageDirectory 'output/component-release-assets' -RuntimeManifestPath 'src-tauri/resources/bin/runtime-manifest.json'
      - name: Sign inline Component Manager catalog
        env:
          RELEASE_COMPONENT_CATALOG_SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_COMPONENT_CATALOG_SIGNING_PRIVATE_KEY }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_COMPONENT_CATALOG_SIGNING_PRIVATE_KEY)) {
            throw 'The release environment is missing RELEASE_COMPONENT_CATALOG_SIGNING_PRIVATE_KEY.'
          }
          cargo run --manifest-path src-tauri/Cargo.toml --locked --quiet --features maintainer-tooling --example component-catalog-tool -- sign --input 'output/component-release-assets/component-catalog-payload.json' --output 'output/component-release-assets/component-catalog-v1.json'
          if ($LASTEXITCODE -ne 0) { throw 'Inline Component Manager catalog signing failed.' }
      - name: Verify catalog with the production public key embedded in Core
        shell: pwsh
        run: |
          cargo run --manifest-path src-tauri/Cargo.toml --locked --quiet --features maintainer-tooling --example component-catalog-tool -- verify-production --input 'output/component-release-assets/component-catalog-v1.json'
          if ($LASTEXITCODE -ne 0) { throw 'The inline component catalog did not verify with Core production trust.' }
          Remove-Item -LiteralPath 'output/component-release-assets/component-catalog-payload.json' -Force
          node scripts/validation/component-release-assets.mjs --directory output/component-release-assets
          if ($LASTEXITCODE -ne 0) { throw 'Component release asset and catalog-link validation failed.' }
          Get-ChildItem output/component-release-assets -File | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination (Join-Path 'output/update-release' $_.Name)
          }
      - name: Generate and verify SHA256SUMS for the exact release artifact
        shell: pwsh
        run: |
          $checksumPath = Join-Path $PWD 'output/update-release/SHA256SUMS.txt'
          $checksumLines = @(Get-ChildItem output/update-release -File | Where-Object Name -ne 'SHA256SUMS.txt' | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
          })
          if ($checksumLines.Count -eq 0) { throw 'The final release package contains no files.' }
          $checksumLines | Set-Content -LiteralPath $checksumPath -Encoding ASCII
          node scripts/validation/verify-release-artifact.mjs --directory output/update-release
          if ($LASTEXITCODE -ne 0) { throw 'The final release artifact failed its checksum inventory.' }
      - name: Upload immutable signed release artifact
        id: release_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cdm-release-${{ env.RELEASE_TAG }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/update-release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  verify-binary-release:
    needs: package-sign
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund
      - name: Download exactly the package-sign artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.package-sign.outputs.release_artifact_id }}
          path: output/update-release
      - name: Verify the downloaded artifact inventory and SHA-256 values
        run: node scripts/validation/verify-release-artifact.mjs --directory output/update-release
      - name: Verify exact component assets, source links, notices, and inline signature
        shell: pwsh
        run: |
          $componentCatalogPath = 'output/update-release/component-catalog-v1.json'
          $componentCatalog = Get-Content -LiteralPath $componentCatalogPath -Raw | ConvertFrom-Json
          $componentAssetNames = @('component-catalog-v1.json')
          foreach ($component in @($componentCatalog.payload.components)) {
            $componentAssetNames += [string]$component.assetName
            foreach ($source in @($component.correspondingSources)) { $componentAssetNames += [string]$source.assetName }
            foreach ($notice in @($component.licenseNotices)) { $componentAssetNames += [string]$notice.noticeFile }
          }
          $componentVerificationDirectory = 'output/component-assets-verify'
          New-Item -ItemType Directory -Force -Path $componentVerificationDirectory | Out-Null
          foreach ($assetName in ($componentAssetNames | Sort-Object -Unique)) {
            if ($assetName -notmatch '^[A-Za-z0-9][A-Za-z0-9._-]*$') { throw "Unsafe component asset name: $assetName" }
            $assetPath = Join-Path 'output/update-release' $assetName
            if (-not (Test-Path -LiteralPath $assetPath -PathType Leaf)) { throw "Component asset is missing from the downloaded release: $assetName" }
            Copy-Item -LiteralPath $assetPath -Destination (Join-Path $componentVerificationDirectory $assetName)
          }
          node scripts/validation/component-release-assets.mjs --directory $componentVerificationDirectory
          if ($LASTEXITCODE -ne 0) { throw 'The downloaded component release assets failed validation.' }
          cargo run --manifest-path src-tauri/Cargo.toml --locked --quiet --features maintainer-tooling --example component-catalog-tool -- verify-production --input $componentCatalogPath
          if ($LASTEXITCODE -ne 0) { throw 'The downloaded catalog signature did not verify against Core production trust.' }
      - name: Prepare pinned SAFE LEAN MSYS2 toolchain
        shell: pwsh
        run: ./scripts/prepare-safe-lean-toolchain.ps1
      - name: Prepare runtime hashes and notices for inspection
        run: |
          npm run prepare:windows-binaries
          if ($LASTEXITCODE -ne 0) { throw 'Preparing runtime hashes for binary inspection failed.' }
          npm run prepare:third-party-notices
          if ($LASTEXITCODE -ne 0) { throw 'Preparing third-party notices for binary inspection failed.' }
      - name: Inspect the exact signed package and enforce the binary gate
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem output/update-release -File -Filter '*.nsis.zip')
          $sourceArchives = @(Get-ChildItem output/update-release -File -Filter 'clear-download-manager-source.tar')
          if ($packages.Count -ne 1) { throw 'Expected exactly one signed NSIS updater package in the downloaded artifact.' }
          if ($sourceArchives.Count -ne 1) { throw 'Expected exactly one source archive in the downloaded artifact.' }
          $inspection = Join-Path $PWD 'output/binary-package-inspection'
          New-Item -ItemType Directory -Force -Path $inspection | Out-Null
          Expand-Archive -LiteralPath $packages[0].FullName -DestinationPath $inspection -Force
          npm run check:binary-release -- --source-archive $sourceArchives[0].FullName --package $packages[0].FullName --inspection-dir $inspection --release-assets-dir output/update-release --component-assets-dir output/component-assets-verify --component-packages-dir output/update-release
          if ($LASTEXITCODE -ne 0) { throw 'The final binary release gate did not pass; publication is blocked.' }

  publish:
    needs:
      - validate-release-ref
      - preflight-release
      - package-sign
      - verify-binary-release
    if: ${{ needs.validate-release-ref.result == 'success' && needs.preflight-release.result == 'success' && needs.package-sign.result == 'success' && needs.verify-binary-release.result == 'success' }}
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Download the same artifact verified by verify-binary-release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.package-sign.outputs.release_artifact_id }}
          path: output/update-release
      - name: Recheck SHA256SUMS.txt inventory before publication
        run: node scripts/validation/verify-release-artifact.mjs --directory output/update-release
      - name: Publish the already verified files without rebuilding or resigning
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          $encodedTag = [Uri]::EscapeDataString($tag)
          $releasePath = "repos/$($env:GITHUB_REPOSITORY)/releases/tags/$encodedTag"
          $existing = gh api $releasePath 2>&1
          if ($LASTEXITCODE -eq 0) {
            throw "Release $tag already exists; refusing to alter it or upload with --clobber."
          }
          if (($existing -join "`n") -notmatch '(?i)not found|HTTP 404') {
            throw "Could not confirm that release $tag is absent. Refusing to publish."
          }
          $global:LASTEXITCODE = 0
          $releaseFiles = @(Get-ChildItem output/update-release -File | Sort-Object Name | ForEach-Object { $_.FullName })
          if ($releaseFiles.Count -lt 2) { throw 'The verified release artifact is incomplete.' }
          gh release create $tag --verify-tag --repo $env:GITHUB_REPOSITORY --title "Clear Download Manager $tag" --generate-notes @releaseFiles
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release creation failed.' }
      - name: Verify updater endpoint
        shell: pwsh
        run: |
          $releaseTag = [Uri]::EscapeDataString($env:RELEASE_TAG)
          $latestUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$releaseTag/latest.json"
          $latest = Invoke-RestMethod -Uri $latestUrl -Headers @{ 'User-Agent' = 'Clear-Download-Manager-Release-Gate' }
          $platform = $latest.platforms.'windows-x86_64'
          if ([string]::IsNullOrWhiteSpace($platform.url)) { throw 'latest.json does not contain the Windows updater URL.' }
          $asset = Invoke-WebRequest -Uri $platform.url -Method Head -MaximumRedirection 5 -Headers @{ 'User-Agent' = 'Clear-Download-Manager-Release-Gate' }
          if ($asset.StatusCode -lt 200 -or $asset.StatusCode -ge 400) { throw "The updater artifact returned HTTP $($asset.StatusCode)." }
          Write-Host 'OK: latest.json and its Windows updater artifact respond correctly.' -ForegroundColor Green
