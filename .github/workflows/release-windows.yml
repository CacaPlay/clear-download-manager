name: Release Windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-pc-windows-msvc }
      - name: Instalar dependencias visuales de Python
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --no-input playwright
          python -m playwright install chromium
      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund
      - name: Gate de versión y fuente
        run: |
          npm run version:check
          npm run check:release
          npm run build:web
      - name: Resolver repositorio de releases
        shell: pwsh
        run: |
          $cfg = Get-Content src-tauri/resources/updater/updater-config.json -Raw | ConvertFrom-Json
          if (-not $cfg.enabled -or [string]::IsNullOrWhiteSpace($cfg.repository)) {
            throw 'El updater no tiene un repositorio de releases válido.'
          }
          if ($cfg.repository -eq 'CacaPlay/cacatools-download-manager-releases' -and '${{ vars.LEGACY_BRIDGE_READY }}' -ne 'true') {
            throw 'Puente legacy bloqueado: falta validar la continuidad de firma de CacaTools 0.45.4.'
          }
          "RELEASES_REPO=$($cfg.repository)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Repositorio de releases: $($cfg.repository)"
      - name: Preparar runtimes para el gate Rust
        run: npm run prepare:windows-binaries
      - name: Gate Rust
        shell: pwsh
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo check --manifest-path src-tauri/Cargo.toml --locked --all-targets
          cargo test --manifest-path src-tauri/Cargo.toml --locked --lib
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - name: Compilar artefactos Tauri firmados
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: pwsh
        run: |
          $cfg = Get-Content src-tauri/resources/updater/updater-config.json -Raw | ConvertFrom-Json
          if (-not $cfg.enabled -or [string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) { throw 'El updater no está configurado o falta TAURI_SIGNING_PRIVATE_KEY.' }
          npm run build:windows:final
      - name: Preparar latest.json y hashes
        shell: pwsh
        run: |
          ./scripts/prepare-update-release.ps1 -Clean -ReleaseNotes "Release $env:GITHUB_REF_NAME"
          function Get-Sha256Hex([string]$Path) {
            $Hasher = [Security.Cryptography.SHA256]::Create()
            try {
              $Bytes = [IO.File]::ReadAllBytes($Path)
              return ([BitConverter]::ToString($Hasher.ComputeHash($Bytes)) -replace '-', '').ToLowerInvariant()
            }
            finally { $Hasher.Dispose() }
          }
          Get-ChildItem output/update-release -File | ForEach-Object {
            "$((Get-Sha256Hex $_.FullName))  $($_.Name)"
          } | Set-Content output/update-release/SHA256SUMS.txt
      - name: Publicar GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            throw 'Falta el secreto RELEASES_REPO_TOKEN. Debe estar limitado al repositorio publico de Releases.'
          }
          $tag = $env:GITHUB_REF_NAME
          $releaseExists = gh release view $tag --repo $env:RELEASES_REPO 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag --repo $env:RELEASES_REPO output/update-release/* --clobber
          } else {
            gh release create $tag --repo $env:RELEASES_REPO --title "Clear Download Manager $tag" --generate-notes output/update-release/*
          }
      - name: Verificar endpoint del updater
        shell: pwsh
        run: |
          $latestUrl = "https://github.com/$env:RELEASES_REPO/releases/download/${{ github.ref_name }}/latest.json"
          $latest = Invoke-RestMethod -Uri $latestUrl -Headers @{ 'User-Agent' = 'CacaTools-Release-Gate' }
          $platform = $latest.platforms.'windows-x86_64'
          if ([string]::IsNullOrWhiteSpace($platform.url)) { throw 'latest.json no contiene la URL de Windows.' }
          $asset = Invoke-WebRequest -Uri $platform.url -Method Head -MaximumRedirection 5 -Headers @{ 'User-Agent' = 'CacaTools-Release-Gate' }
          if ($asset.StatusCode -lt 200 -or $asset.StatusCode -ge 400) { throw "El artefacto del updater devolvio HTTP $($asset.StatusCode)." }
          Write-Host "OK: latest.json y artefacto del updater responden correctamente." -ForegroundColor Green
